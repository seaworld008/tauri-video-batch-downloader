# GitHub Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Frontend dependencies (pnpm / npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "javascript"
    groups:
      production-dependencies:
        patterns:
          - "@headlessui/react"
          - "@heroicons/react"
          - "@tauri-apps/api"
          - "@tauri-apps/plugin-*"
          - "i18next*"
          - "react"
          - "react-dom"
          - "react-hot-toast"
          - "react-i18next"
          - "zod"
          - "zustand"
      development-dependencies:
        patterns:
          - "@eslint/*"
          - "@tauri-apps/cli"
          - "@testing-library/*"
          - "@types/*"
          - "@typescript-eslint/*"
          - "eslint*"
          - "husky"
          - "jsdom"
          - "prettier"
          - "tailwindcss"
          - "typescript"
      build-tools:
        patterns:
          - "vite*"
          - "vitest*"
          - "@vitejs/*"
          - "@vitest/*"
          - "rollup*"
          - "esbuild*"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]

  # Backend dependencies (Cargo / Rust)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "rust"
    groups:
      tauri-core:
        patterns:
          - "tauri*"
          - "serde*"
          - "tokio*"
      networking:
        patterns:
          - "reqwest*"
          - "hyper*"
          - "url*"
          - "http*"
      async-runtime:
        patterns:
          - "tokio*"
          - "futures*"
          - "async-*"
      serialization:
        patterns:
          - "serde*"
          - "serde_json*"
          - "csv*"
      dev-dependencies:
        patterns:
          - "tempfile*"
          - "criterion*"
          - "proptest*"
    ignore:
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "11:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "github/codeql-action*"
          - "softprops/action-gh-release*"
          - "codecov/codecov-action*"
