[package]
name = "video-downloader-pro"
version = "1.3.0"
description = "Professional batch video downloader"
authors = ["Video Downloader Team"]
edition = "2021"
license = "MIT"
default-run = "video-downloader-pro"
autobins = false

[build-dependencies]
tauri-build = { version = "~2.6.1", features = [] }

[dependencies]
# Tauri 核心
tauri = { version = "~2.11.1", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP 客户端和下载
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "blocking", "charset", "http2", "socks"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# 加密哈希函数库 (RustCrypto)
sha2 = "0.10"           # SHA-2 family (SHA-256, SHA-512)
blake2 = "0.10"         # BLAKE2 family
md-5 = "0.10"           # MD5 (for legacy support)
sha1 = "0.10"           # SHA-1 (for legacy support)
digest = "0.10"         # Common traits for hash functions
hex = "0.4"             # Hex encoding/decoding
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"

# UUID 生成
uuid = { version = "1.0", features = ["v4", "serde"] }

# 日志系统
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 文件处理
csv = "1.3"
encoding_rs = "0.8"
encoding_rs_io = "0.1"  # 流式编码转换
chardetng = "0.1"       # 高精度编码检测
calamine = "0.38"       # Excel 读取

# Futures 工具集
futures-util = "0.3"
url = "2.5.9"
quick-xml = "0.42"

# 正则表达式
regex = "1.10"

# 配置管理
directories = "5.0"

# 并发和同步
parking_lot = "0.12"

# 随机数生成
rand = "0.10"
tauri-plugin-dialog = "~2.7.1"
tauri-plugin-mcp-bridge = "0.9.0"

[dev-dependencies]
# 测试依赖
tempfile = "3.8"

[[bin]]
name = "video-downloader-pro"
path = "src/main.rs"

[[bin]]
name = "vdpro-cli"
path = "src/bin/vdpro_cli.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
integration-tests = []
local-logging = []

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "libloaderapi", "combaseapi", "winerror"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
