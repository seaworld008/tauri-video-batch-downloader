[package]
name = "vdpro-core"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Core domain models, configuration, error handling, validation, and integrity verification for Video Downloader Pro"

[dependencies]
anyhow = "1.0"
blake2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
digest = "0.10"
directories = "5.0"
hex = "0.4"
md-5 = "0.10"
rand = "0.10"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["fs", "process", "rt", "sync", "time"] }
tracing = "0.1"
url = "2.5.9"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
